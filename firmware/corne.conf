# Shared settings for corne_left and corne_right (ZMK picks this up as corne.conf).
# Settings that only apply to the central (left) are harmless on the right and ignored.

# Deep sleep after inactivity. Works on nRF52840 (nice!nano).
CONFIG_ZMK_SLEEP=y
# Idle time before deep sleep, in ms. 900000 = 15 minutes (ZMK default, set explicitly).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Battery level reporting to the host over BLE (Battery Service).
CONFIG_ZMK_BATTERY_REPORTING=y
# Left (central) reads the right half's battery level over the split link.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Left also exposes the right half's level to the host as a second battery.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ZMK Studio locking: while locked, keymap edits over USB need &studio_unlock (adjust layer).
# Studio itself is enabled on the left build only, via cmake-args in build.yaml.
CONFIG_ZMK_STUDIO_LOCKING=y

# nice!view (later): uncomment together with the nice_view lines in build.yaml.
# CONFIG_ZMK_DISPLAY=y

# SuperMini nRF52840 clones: some batches have a missing or faulty 32.768 kHz crystal, so a half
# will not pair or keeps dropping. Only then, uncomment to run the low-frequency clock from the
# internal RC oscillator. It costs a little sleep current and may slow boot; leave it off on a
# nice!nano. See firmware/README.md, "SuperMini clones".
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
